[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decane-sdk"
version = "0.8.0"
description = "Official Python SDK for Decane — institutional liquidity rail for crypto settlement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Decane", email = "dev@decane.io" }]
keywords = ["crypto", "payments", "bitcoin", "ethereum", "stablecoins", "payment-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[project.urls]
Homepage = "https://decane.io"
Documentation = "https://decane.io/docs"
Repository = "https://github.com/Decane-io/decane-python"
Issues = "https://github.com/Decane-io/decane-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["decane"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
