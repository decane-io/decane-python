[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vylth-flow"
version = "0.3.3"
description = "Official Python SDK for Vylth Flow — self-custody crypto payment processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vylth", email = "dev@vylth.com" }]
keywords = ["crypto", "payments", "bitcoin", "ethereum", "self-custody", "payment-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[project.urls]
Homepage = "https://flow.vylth.com"
Documentation = "https://docs.flow.vylth.com"
Repository = "https://github.com/VYLTH/flow-python"
Issues = "https://github.com/VYLTH/flow-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["vylth_flow"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
